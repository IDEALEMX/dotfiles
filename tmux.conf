# KEYBINDING SYNTAX
# bind KEY command	Bind KEY after prefix (default behavior)
# bind -r KEY command	Repeatable binding -- key can be pressed again within repeat-time without re-pressing prefix
# bind -n KEY command	No prefix required -- key triggers the command directly (use with caution)
# bind -T TABLE KEY command	Bind to a specific key table (prefix, root, copy-mode-vi, etc.)

# Change default tmux prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better splits
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation (M + h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Nvim binds

# Vim-style pane resizing
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# STATUS BAR
# Status bar colors
set -g status-style bg=colour0,fg=colour136

# Left side: session name
set -g status-left-length 40
set -g status-left "#[fg=colour10,bold]#S #[fg=colour245]| "

# Right side: date, time, and hostname
set -g status-right-length 60
set -g status-right "#[fg=colour14]%Y-%m-%d #[fg=colour10]%H:%M #[fg=colour9]#H"

# Center the window list
set -g status-justify centre

# Update the status bar every second (for clock)
set -g status-interval 1

# Active window styling in status bar
setw -g window-status-current-style fg=colour10,bold
setw -g window-status-current-format " #I:#W "

# Inactive window styling
setw -g window-status-style fg=colour245
setw -g window-status-format " #I:#W "

set -g pane-active-border-style "bg=default fg=colour10"

# WINDOW AND PANE NAMING
# Start window numbering at 1 (instead of 0)
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# Renumber windows when one is closed (avoids gaps like 1, 3, 4)
set -g renumber-windows on

# Automatically rename windows based on the running command
setw -g automatic-rename on

# Set the terminal title (shown in terminal tab/title bar)
set -g set-titles on
set -g set-titles-string "#S - #W"

# Set def. shell
set-option -g default-shell /bin/nu

# Tmux resurrect
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Optional: enable automatic save/restore
set -g @resurrect-strategy-nvim 'session'
run '~/.tmux/plugins/tpm/tpm'
