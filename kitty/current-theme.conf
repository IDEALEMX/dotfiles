# The basic colors
foreground #90929a
background #11121c
selection_foreground #11121c
selection_background #5b4b7d

# Cursor colors
cursor #90929a
cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
url_color               #F5E0DC

# Kitty window border colors
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #c3c3c6
active_tab_background   #645389
inactive_tab_foreground #90929a
inactive_tab_background #11121c
