# The basic colors
foreground #94909b
background #140d20
selection_foreground #140d20
selection_background #475288

# Cursor colors
cursor #94909b
cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
url_color               #F5E0DC

# Kitty window border colors
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #c4c2c7
active_tab_background   #751c78
inactive_tab_foreground #94909b
inactive_tab_background #140d20
